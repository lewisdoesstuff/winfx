name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release on version tags
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Lint and test in the dev profile: the release profile's LTO is slow,
      # and only the installer needs it.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          cargo install cargo-about --locked --features cli
          choco install innosetup --no-progress -y
          ./tools/build-release.ps1 -SkipTests

      # Code signing goes here once a certificate is set up (Azure Trusted
      # Signing or SignPath): sign target\release\winfx.exe and winfx_apo.dll
      # before the installer step, then the installer itself.

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.exe
