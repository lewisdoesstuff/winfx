name: Feature request
description: An effect, preset format or improvement you'd like.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The sound you're after or the task you're stuck on, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Links to other apps or plug-ins that do it well are useful.
