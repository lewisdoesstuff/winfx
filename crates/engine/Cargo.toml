[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wasapi.workspace = true
rtrb.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
hound = "3"
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_System_Registry"] }

