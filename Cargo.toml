[workspace]
resolver = "3"
members = ["crates/engine", "crates/app", "crates/apo"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
engine = { path = "crates/engine" }
wasapi = "0.27"
windows = "0.62"
rtrb = "0.4"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "0.9.1"
tray-icon = "0.26"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
